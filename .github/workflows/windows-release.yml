name: Build LabFlow Windows installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_DIR: source/LabFlow-PostgreSQL-v2.3.3

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.SOURCE_DIR }}/frontend/package-lock.json
      - name: Build frontend assets
        working-directory: ${{ env.SOURCE_DIR }}/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: labflow-v2.3.3-frontend
          path: ${{ env.SOURCE_DIR }}/backend/static

  build:
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: labflow-v2.3.3-frontend
          path: ${{ env.SOURCE_DIR }}/backend/static
      - uses: dtolnay/rust-toolchain@stable
      - name: Build server
        working-directory: ${{ env.SOURCE_DIR }}
        run: cargo build --release --locked
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installers
        working-directory: ${{ env.SOURCE_DIR }}
        shell: powershell
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' build_server_installer.iss
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' build_hot_update_installer.iss
          Get-ChildItem installer -Filter '*.exe' | Select-Object Name,Length
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: labflow-${{ github.ref_name }}-windows
          path: |
            ${{ env.SOURCE_DIR }}/installer/LabFlow-v2.3.3.exe
            ${{ env.SOURCE_DIR }}/installer/LabFlow-v2.3.3-HotUpdate.exe
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.SOURCE_DIR }}/installer/LabFlow-v2.3.3.exe
            ${{ env.SOURCE_DIR }}/installer/LabFlow-v2.3.3-HotUpdate.exe
          fail_on_unmatched_files: true
          overwrite_files: true
