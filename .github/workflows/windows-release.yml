name: Build LabFlow Windows installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_DIR: source/LabFlow-PostgreSQL-v2.3.8

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare VC++ runtime
        working-directory: ${{ env.SOURCE_DIR }}
        shell: powershell
        run: |
          $runtimeDir = Join-Path $PWD 'postgres-runtime\installer'
          New-Item -ItemType Directory -Path $runtimeDir -Force | Out-Null
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile (Join-Path $runtimeDir 'vcredist_x64.exe')
      - name: Build server
        working-directory: ${{ env.SOURCE_DIR }}
        run: cargo build --release --locked
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installers
        working-directory: ${{ env.SOURCE_DIR }}
        shell: powershell
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' build_server_installer.iss
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' build_hot_update_installer.iss
          Get-ChildItem installer -Filter '*.exe' | Select-Object Name,Length
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: labflow-${{ github.ref_name }}-windows
          path: |
            ${{ env.SOURCE_DIR }}/installer/LabFlow-v2.3.8.exe
            ${{ env.SOURCE_DIR }}/installer/LabFlow-v2.3.8-HotUpdate.exe
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.SOURCE_DIR }}/installer/LabFlow-v2.3.8.exe
            ${{ env.SOURCE_DIR }}/installer/LabFlow-v2.3.8-HotUpdate.exe
