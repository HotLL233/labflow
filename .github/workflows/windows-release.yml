name: Build LabFlow Windows installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit release version (X.Y.Z)"
        required: true
        type: string
      compile_backend_tests:
        description: "Build a test harness for isolated database acceptance (does not run tests)"
        required: false
        default: false
        type: boolean
      run_acceptance:
        description: "Run isolated database and Windows installer acceptance (requires test harness)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: labflow-windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            scripts
            build-resources
            docs
            source/LabFlow-PostgreSQL-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test shared release automation
        shell: pwsh
        run: ./scripts/test-automation.ps1
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve version and source directory
        id: version
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          RUN_ACCEPTANCE: ${{ inputs.run_acceptance }}
          COMPILE_BACKEND_TESTS: ${{ inputs.compile_backend_tests }}
        run: |
          if ($env:RUN_ACCEPTANCE -eq 'true' -and $env:COMPILE_BACKEND_TESTS -ne 'true') { throw 'Acceptance requires compile_backend_tests.' }
          $arguments = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { @{ Version = $env:DISPATCH_VERSION } } else { @{ Tag = $env:GITHUB_REF_NAME } }
          $release = & ./scripts/resolve-release.ps1 @arguments
          "source_dir=$($release.source_dir)" >> $env:GITHUB_OUTPUT
          "version=$($release.version)" >> $env:GITHUB_OUTPUT
          Import-Module ./scripts/lib/labflow-automation.psm1 -Force
          $identity = Get-LabFlowIdentity -SourceDir $release.source_dir
          "full_installer=$($identity.installer_names[0])" >> $env:GITHUB_OUTPUT
          "hot_installer=$($identity.installer_names[1])" >> $env:GITHUB_OUTPUT
      - name: Check release publication policy
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ./scripts/release-policy.cjs windows '${{ steps.version.outputs.version }}'
      - name: Verify all Build inputs (database tests not run)
        shell: pwsh
        run: |
          & ./scripts/verify.ps1 -SourceDir '${{ steps.version.outputs.source_dir }}' -Profile Build -Component All -OutputDir "$env:GITHUB_WORKSPACE/ci-artifacts/windows/verification" -InstallDependencies
      - name: Build isolated acceptance test harness
        id: backend_harness
        if: github.event_name == 'workflow_dispatch' && inputs.compile_backend_tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = '${{ steps.version.outputs.source_dir }}'
          $out = "$env:GITHUB_WORKSPACE/ci-artifacts/windows/backend-tests"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $env:CARGO_BUILD_JOBS = '1'
          Push-Location $source
          try {
            & cargo test --locked --lib --no-run --message-format=json --config 'profile.test.debug=0' --config 'profile.test.codegen-units=1' --config 'profile.test.incremental=false' --config 'profile.test.package.labflow.codegen-units=16' > "$out/compiler.jsonl" 2> "$out/compiler.log"
            if ($LASTEXITCODE -ne 0) { throw 'Test harness compilation failed.' }
            $artifacts = @([IO.File]::ReadLines("$out/compiler.jsonl") | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.executable -and $_.target.kind -contains 'lib' })
            if ($artifacts.Count -ne 1) { throw 'Expected exactly one application library test harness.' }
            Copy-Item -LiteralPath $artifacts[0].executable -Destination "$out/labflow-tests.exe"
            $verification = Get-Content "$env:GITHUB_WORKSPACE/ci-artifacts/windows/verification/verification.json" -Raw | ConvertFrom-Json
            Copy-Item -LiteralPath $verification.artifacts.executable_path -Destination "$out/labflow.exe"
            Copy-Item -LiteralPath $verification.artifacts.static_path -Destination "$out/static" -Recurse
            Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE/ci-artifacts/windows/verification/verification.json" -Destination "$out/build-verification.json"
            $applicationHash = (Get-FileHash "$out/labflow.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($applicationHash -ne $verification.artifacts.executable_sha256) { throw 'Application snapshot differs from the verified Build.' }
            Import-Module "$env:GITHUB_WORKSPACE/scripts/lib/labflow-automation.psm1" -Force
            if ((Get-LabFlowTreeHash "$out/static") -ne $verification.artifacts.static_sha256) { throw 'Frontend snapshot differs from the verified Build.' }
            @{ version='${{ steps.version.outputs.version }}'; source_commit=$env:GITHUB_SHA; input_fingerprint=(Get-LabFlowInputFingerprint $source); executable_sha256=(Get-FileHash "$out/labflow-tests.exe" -Algorithm SHA256).Hash.ToLowerInvariant(); application_sha256=$applicationHash; tests_executed=$false; production_release_profile_unchanged=$true } | ConvertTo-Json | Set-Content "$out/provenance.json" -Encoding utf8
          } finally { Pop-Location }
      - name: Upload isolated acceptance test harness
        if: always() && github.event_name == 'workflow_dispatch' && inputs.compile_backend_tests && steps.backend_harness.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: labflow-backend-tests-${{ github.run_id }}
          path: ci-artifacts/windows/backend-tests
          if-no-files-found: error
      - name: Upload frontend acceptance snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.run_acceptance
        uses: actions/upload-artifact@v4
        with:
          name: labflow-static-${{ github.run_id }}
          path: |
            ci-artifacts/windows/backend-tests/static
            ci-artifacts/windows/backend-tests/build-verification.json
            ci-artifacts/windows/backend-tests/provenance.json
          if-no-files-found: error
      - name: Prepare VC++ runtime
        shell: pwsh
        run: |
          $runtimeDir = Join-Path $env:GITHUB_WORKSPACE 'build-resources/postgres-runtime/installer'
          New-Item -ItemType Directory -Path $runtimeDir -Force | Out-Null
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile (Join-Path $runtimeDir 'vcredist_x64.exe')
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installers from verified artifacts
        id: installer_build
        shell: pwsh
        run: |
          & ./scripts/build-installers.ps1 -SourceDir '${{ steps.version.outputs.source_dir }}' -VerificationReport "$env:GITHUB_WORKSPACE/ci-artifacts/windows/verification/verification.json" -OutputDir "$env:GITHUB_WORKSPACE/ci-artifacts/windows/installers" -IsccPath 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      - name: Run isolated backend acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.run_acceptance
        shell: pwsh
        run: |
          & ./scripts/test-backend-ci.ps1 -SourceDir '${{ steps.version.outputs.source_dir }}' -ArtifactDir "$env:GITHUB_WORKSPACE/ci-artifacts/windows/backend-tests" -OutputDir "$env:GITHUB_WORKSPACE/ci-artifacts/windows/backend-acceptance"
      - name: Run Windows installer lifecycle acceptance
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_acceptance && steps.installer_build.outcome == 'success'
        shell: pwsh
        run: |
          node ./scripts/test-windows-installer.cjs '${{ steps.version.outputs.source_dir }}' 'ci-artifacts/windows/installers' 'ci-artifacts/windows/installer-acceptance'
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer lifecycle acceptance failed.' }
      - name: Write Windows delivery manifest
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $artifacts = @("$env:GITHUB_WORKSPACE/ci-artifacts/windows/installers/${{ steps.version.outputs.full_installer }}", "$env:GITHUB_WORKSPACE/ci-artifacts/windows/installers/${{ steps.version.outputs.hot_installer }}")
          & ./scripts/write-delivery-manifest.ps1 -SourceDir '${{ steps.version.outputs.source_dir }}' -OutputDir "$env:GITHUB_WORKSPACE/ci-artifacts/windows/delivery" -ArtifactPath $artifacts -RequireWindowsInstallers -VerificationReport "$env:GITHUB_WORKSPACE/ci-artifacts/windows/verification/verification.json"
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE/ci-artifacts/windows/delivery/交付清单.md" -Destination "$env:GITHUB_WORKSPACE/ci-artifacts/windows/delivery/DELIVERY-CHECKLIST.md"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: labflow-${{ github.ref_name }}-windows
          path: |
            ci-artifacts/windows/installers/${{ steps.version.outputs.full_installer }}
            ci-artifacts/windows/installers/${{ steps.version.outputs.hot_installer }}
            ci-artifacts/windows/delivery/manifest.json
            ci-artifacts/windows/delivery/SHA256SUMS
            ci-artifacts/windows/delivery/DELIVERY-CHECKLIST.md
          if-no-files-found: error
      - name: Upload isolated acceptance logs
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_acceptance
        uses: actions/upload-artifact@v4
        with:
          name: labflow-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-artifacts/windows/backend-acceptance/*.json
            ci-artifacts/windows/backend-acceptance/*.log
            ci-artifacts/windows/installer-acceptance/*.json
            ci-artifacts/windows/installer-acceptance/redacted/*.log
            ci-artifacts/windows/delivery/manifest.json
            ci-artifacts/windows/delivery/SHA256SUMS
            ci-artifacts/windows/delivery/DELIVERY-CHECKLIST.md
          if-no-files-found: warn
      - name: Recheck publication policy before release creation
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ./scripts/release-policy.cjs windows '${{ steps.version.outputs.version }}'
      - name: Create GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: labflow v${{ steps.version.outputs.version }}
          generate_release_notes: true
          overwrite_files: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            ci-artifacts/windows/installers/${{ steps.version.outputs.full_installer }}
            ci-artifacts/windows/installers/${{ steps.version.outputs.hot_installer }}
            ci-artifacts/windows/delivery/manifest.json
            ci-artifacts/windows/delivery/SHA256SUMS
            ci-artifacts/windows/delivery/DELIVERY-CHECKLIST.md
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labflow-windows-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-artifacts/release-policy-windows.json
            ci-artifacts/windows/verification/verification.json
            ci-artifacts/windows/verification/**/*.log
          if-no-files-found: warn
