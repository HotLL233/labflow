name: Check repository governance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "PROJECT_MEMORY.md"
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - "installers/**"
      - "source/**/postgres-runtime/**"
      - "source/**/pdf-runtime/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "PROJECT_MEMORY.md"
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - "installers/**"
      - "source/**/postgres-runtime/**"
      - "source/**/pdf-runtime/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            scripts
            docs
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify shared automation and release policy
        shell: pwsh
        run: ./scripts/test-automation.ps1
