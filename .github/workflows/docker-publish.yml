name: Build and publish LabFlow Docker image

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SOURCE_DIR: source/LabFlow-PostgreSQL-v2.3.3
  IMAGE_NAME: ghcr.io/hotll233/labflow
  GITEE_REGISTRY: ${{ secrets.GITEE_REGISTRY }}
  GITEE_IMAGE_NAME: ${{ secrets.GITEE_IMAGE_NAME }}
  GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
  GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.SOURCE_DIR }}/frontend/package-lock.json
      - name: Build frontend assets
        working-directory: ${{ env.SOURCE_DIR }}/frontend
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: labflow-v2.3.3-frontend
          path: ${{ env.SOURCE_DIR }}/backend/static

  build-and-push:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: labflow-v2.3.3-frontend
          path: ${{ env.SOURCE_DIR }}/backend/static

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Gitee container registry
        if: ${{ env.GITEE_REGISTRY != '' && env.GITEE_IMAGE_NAME != '' && env.GITEE_USERNAME != '' && env.GITEE_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITEE_REGISTRY }}
          username: ${{ env.GITEE_USERNAME }}
          password: ${{ env.GITEE_TOKEN }}

      - name: Resolve image version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(cat "${SOURCE_DIR}/VERSION")"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build and push GHCR image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SOURCE_DIR }}
          file: ${{ env.SOURCE_DIR }}/Dockerfile
          # Build on the native GitHub-hosted runner for a predictable completion time.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=labflow
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/HotLL233/labflow

      - name: Build and push Gitee image
        if: ${{ env.GITEE_REGISTRY != '' && env.GITEE_IMAGE_NAME != '' && env.GITEE_USERNAME != '' && env.GITEE_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SOURCE_DIR }}
          file: ${{ env.SOURCE_DIR }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GITEE_REGISTRY }}/${{ env.GITEE_IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.GITEE_REGISTRY }}/${{ env.GITEE_IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=labflow
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://gitee.com/HotLL233/labflow


