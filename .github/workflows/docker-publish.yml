name: Build and publish LabFlow Docker image

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/hotll233/labflow
  GITEE_REGISTRY: ${{ secrets.GITEE_REGISTRY }}
  GITEE_IMAGE_NAME: ${{ secrets.GITEE_IMAGE_NAME }}
  GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
  GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and source directory
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            SOURCE_DIR="source/LabFlow-PostgreSQL-v${VERSION}"
          else
            SOURCE_DIR="$(find source -maxdepth 1 -mindepth 1 -type d -name 'LabFlow-PostgreSQL-v*' | sort -V | tail -n 1)"
            VERSION="$(cat "${SOURCE_DIR}/VERSION")"
          fi
          test -f "${SOURCE_DIR}/VERSION"
          echo "source_dir=${SOURCE_DIR}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Gitee container registry
        if: ${{ env.GITEE_REGISTRY != '' && env.GITEE_IMAGE_NAME != '' && env.GITEE_USERNAME != '' && env.GITEE_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITEE_REGISTRY }}
          username: ${{ env.GITEE_USERNAME }}
          password: ${{ env.GITEE_TOKEN }}

      - name: Build and push GHCR image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.version.outputs.source_dir }}
          file: ${{ steps.version.outputs.source_dir }}/Dockerfile
          # Build on the native GitHub-hosted runner for a predictable completion time.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=labflow
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/HotLL233/labflow

      - name: Build and push Gitee image
        if: ${{ env.GITEE_REGISTRY != '' && env.GITEE_IMAGE_NAME != '' && env.GITEE_USERNAME != '' && env.GITEE_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.version.outputs.source_dir }}
          file: ${{ steps.version.outputs.source_dir }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GITEE_REGISTRY }}/${{ env.GITEE_IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.GITEE_REGISTRY }}/${{ env.GITEE_IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=labflow
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://gitee.com/HotLL233/labflow


