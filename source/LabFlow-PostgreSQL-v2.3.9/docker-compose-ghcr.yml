x-labflow-repositories:
  gitee_source: https://gitee.com/HotLL233/labflow
  ghcr_image: ${LABFLOW_GHCR_IMAGE:-ghcr.io/hotll233/labflow}
  # Fill this with the container registry image path provided by Gitee Packages.
  gitee_image: ${LABFLOW_GITEE_IMAGE:-}

services:
  app:
    # Use scripts/pull-labflow-image.ps1 or .sh for registry fallback.
    image: "${LABFLOW_IMAGE:-${LABFLOW_GHCR_IMAGE:-ghcr.io/hotll233/labflow}}:${LABFLOW_VERSION:-2.3.9}"
    container_name: labflow-app
    ports:
      - "${WORKLOAD_BIND_IP:-127.0.0.1}:${WORKLOAD_SERVER_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-workload_app}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-workload_tool}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me}
      WORKLOAD_SERVER_PORT: "8000"
      WORKLOAD_SERVER_MODE: "true"
      WORKLOAD_DATA_DIR: /app/data
      WORKLOAD_ATTACHMENT_PREVIEW_DIR: /app/data/attachment_previews
      PERSONNEL_CHANGE_DATA_DIR: /app/data/personnel-change-data
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - workload_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: labflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workload_tool}
      POSTGRES_USER: ${POSTGRES_USER:-workload_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  workload_data:
  postgres_data:





