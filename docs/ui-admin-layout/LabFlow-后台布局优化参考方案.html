<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>样品管理系统 · 后台布局参考方案</title>
  <style>
    :root {
      --bg:#f5f6f7; --surface:#fff; --raised:#f2f4f6; --line:#dce1e6;
      --ink:#20252b; --secondary:#525c68; --muted:#67717c;
      --accent:#1769aa; --accent-hover:#125789; --accent-soft:#eaf2f9;
      --good:#287249; --good-bg:#edf6f0; --bad:#ae3033; --bad-bg:#fcf0f0;
      --warn:#925319; --warn-bg:#fcf4e9; --radius:4px; --row:44px;
      --sidebar:232px; --control:36px;
    }
    * { box-sizing:border-box; }
    html { font-size:14px; scrollbar-gutter:stable; }
    body { margin:0; color:var(--ink); background:var(--bg); font-family:"Segoe UI","Microsoft YaHei","PingFang SC",Arial,sans-serif; line-height:1.5; letter-spacing:0; }
    button,input,select,textarea { font:inherit; letter-spacing:0; }
    button { cursor:pointer; }
    button:disabled { cursor:default; opacity:.5; }
    button,a,input,select,textarea { -webkit-tap-highlight-color:transparent; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    [hidden] { display:none!important; }
    button,input,select,textarea { border-radius:var(--radius); }
    button { color:inherit; }
    h1,h2,h3,p { margin:0; }
    h1 { font-size:24px; line-height:32px; font-weight:600; }
    h2 { font-size:16px; line-height:24px; font-weight:600; }
    h3 { font-size:14px; font-weight:600; }
    a { color:var(--accent); }
    .ico { width:18px; height:18px; flex:0 0 18px; fill:currentColor; vertical-align:middle; }
    .row { display:flex; align-items:center; gap:8px; }
    .between { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .wrap { flex-wrap:wrap; }
    .grow { flex:1; min-width:0; }
    .muted { color:var(--muted); }
    .small { font-size:12px; line-height:20px; }
    .num { font-variant-numeric:tabular-nums; }
    .secondary { color:var(--secondary); }
    .button,.icon-button { border:1px solid var(--line); background:var(--surface); display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:var(--control); padding:6px 12px; text-decoration:none; white-space:nowrap; flex-shrink:0; font-size:13px; font-weight:500; transition:background-color 150ms,border-color 150ms,color 150ms; }
    .button:hover,.icon-button:hover { background:var(--raised); border-color:#bbc5cf; }
    .button.primary { background:var(--accent); color:white; border-color:var(--accent); }
    .button.primary:hover { background:var(--accent-hover); }
    .button.danger { color:var(--bad); border-color:#e7bdbd; }
    .button.quiet { border-color:transparent; background:transparent; color:var(--secondary); }
    .icon-button { padding:8px; width:36px; }
    .button.tiny { min-height:28px; padding:3px 8px; font-size:12px; }
    .prototype-strip { background:#eef2f5; border-bottom:1px solid var(--line); padding:8px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:40px; font-size:12px; color:var(--secondary); }
    .prototype-strip strong { color:var(--ink); font-weight:600; }
    .prototype-strip a { white-space:nowrap; text-decoration:none; }
    .appbar { height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; gap:16px; background:white; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:12px; white-space:nowrap; }
    .brand-mark { display:grid; place-items:center; width:32px; height:32px; border:1px solid #adc6da; border-radius:4px; color:var(--accent); font-size:18px; font-weight:600; }
    .brand-name { font-size:15px; font-weight:600; }
    .appbar nav { display:flex; align-items:center; gap:4px; }
    .appbar .nav-label { font-size:13px; }
    .appbar .selected { background:var(--accent-soft); color:var(--accent); }
    .notification { position:relative; }
    .notification b { position:absolute; top:-1px; right:-1px; min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:var(--bad); color:white; font-size:10px; line-height:16px; font-weight:500; }
    .account { border-left:1px solid var(--line); margin-left:8px; padding-left:16px; font-size:13px; }
    .shell { display:grid; grid-template-columns:var(--sidebar) minmax(0,1fr); min-height:calc(100vh - 96px); }
    .sidebar { background:white; border-right:1px solid var(--line); display:flex; flex-direction:column; min-width:0; }
    .sidebar-top { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px; }
    .sidebar-title { font-size:13px; font-weight:600; color:var(--secondary); }
    .nav-scroll { padding:0 8px 16px; }
    .nav-group { margin-top:16px; }
    .nav-group:first-child { margin-top:4px; }
    .nav-group-title { font-size:12px; line-height:20px; color:var(--muted); padding:0 12px; margin-bottom:4px; }
    .nav-item { width:100%; min-height:36px; display:flex; align-items:center; gap:12px; padding:6px 12px; color:var(--secondary); text-align:left; border:1px solid transparent; background:transparent; font-size:13px; text-decoration:none; border-radius:4px; }
    button.nav-item:hover { background:var(--raised); }
    .nav-item.active { background:var(--accent-soft); border-color:#d6e5f2; color:var(--accent); font-weight:600; }
    .nav-item.undetailed { color:#65717d; }
    .nav-item .ico { width:16px; height:16px; flex-basis:16px; }
    .nav-foot { margin-top:auto; padding:16px 20px; font-size:12px; color:var(--muted); border-top:1px solid var(--line); }
    main { min-width:0; padding:20px 24px 32px; }
    .breadcrumb { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-bottom:12px; }
    .breadcrumb .ico { width:14px; height:14px; flex-basis:14px; }
    .page-head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:16px; }
    .page-head .title-block { min-width:0; }
    .page-head p { margin-top:4px; font-size:13px; color:var(--secondary); }
    .head-actions { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
    .back { min-height:32px; font-size:12px; }
    .back .ico { width:16px; height:16px; flex-basis:16px; }
    .body-band { background:white; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .tabs { display:flex; gap:20px; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:thin; }
    .tab { flex-shrink:0; padding:12px 0; min-height:44px; border:0; border-radius:0; border-bottom:2px solid transparent; background:transparent; color:var(--secondary); white-space:nowrap; font-size:13px; }
    .tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:16px 0; }
    .field { display:flex; flex-direction:column; gap:4px; min-width:0; font-size:12px; color:var(--secondary); }
    .field input,.field select,.field textarea,.search input { width:100%; min-height:var(--control); border:1px solid #c7cfd7; color:var(--ink); background:white; padding:6px 10px; min-width:0; }
    .field input:focus,.field select:focus,.field textarea:focus,.search:focus-within { border-color:var(--accent); outline:1px solid var(--accent); }
    .search { display:flex; align-items:center; gap:8px; border:1px solid #c7cfd7; border-radius:4px; padding:0 10px; width:300px; min-height:var(--control); color:var(--muted); }
    .search input { border:0; padding:6px 0; outline:0!important; background:transparent; font-size:13px; }
    .toolbar select { min-height:var(--control); border:1px solid #c7cfd7; padding:4px 28px 4px 10px; background:white; font-size:13px; color:var(--secondary); max-width:100%; }
    .toolbar-meta { margin-left:auto; font-size:12px; color:var(--muted); white-space:nowrap; }
    .table-wrap { max-width:100%; overflow:auto; border-top:1px solid var(--line); border-bottom:1px solid var(--line); scrollbar-width:thin; background:white; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { background:#f1f3f5; color:var(--secondary); font-size:12px; font-weight:500; text-align:left; height:40px; white-space:nowrap; }
    td { height:var(--row); color:var(--ink); border-top:1px solid #e8ebee; }
    th,td { padding:8px 12px; vertical-align:middle; }
    tbody tr:hover { background:#f7f9fb; }
    th.right,td.right { text-align:right; font-variant-numeric:tabular-nums; }
    td.name { min-width:240px; font-weight:500; }
    .status { display:inline-flex; align-items:center; gap:6px; color:var(--secondary); font-size:12px; white-space:nowrap; }
    .status::before { content:""; width:6px; height:6px; border-radius:3px; background:#8a949e; }
    .status.good { color:var(--good); }
    .status.good::before { background:var(--good); }
    .status.bad { color:var(--bad); }
    .status.bad::before { background:var(--bad); }
    .status.warn { color:var(--warn); }
    .status.warn::before { background:var(--warn); }
    .flag { display:inline-flex; align-items:center; min-height:24px; padding:2px 6px; font-size:12px; border-radius:3px; background:var(--raised); color:var(--secondary); white-space:nowrap; }
    .flag.info { background:var(--accent-soft); color:var(--accent); }
    .row-actions { display:flex; align-items:center; justify-content:flex-end; gap:8px; white-space:nowrap; }
    .text-action { font-size:12px; border:0; padding:4px 0; color:var(--accent); background:transparent; min-height:28px; }
    .text-action:hover { text-decoration:underline; }
    .pagination { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; color:var(--secondary); font-size:12px; }
    .pagination select { min-height:28px; border:1px solid var(--line); background:white; padding:2px 6px; }
    .pagination .icon-button { width:28px; min-height:28px; padding:4px; }
    .tip { display:flex; align-items:flex-start; gap:8px; padding:12px 0; color:var(--secondary); font-size:12px; line-height:20px; }
    .tip .ico { margin-top:1px; width:16px; height:16px; flex-basis:16px; }
    .notice { border-left:3px solid #b8cddd; padding:8px 12px; background:#f0f4f7; color:var(--secondary); font-size:12px; line-height:20px; margin:16px 0; }
    .master-grid { display:grid; grid-template-columns:156px minmax(0,1fr); gap:20px; margin-top:16px; }
    .sheet-nav { border-right:1px solid var(--line); padding-right:12px; }
    .sheet-nav button { width:100%; min-height:36px; background:transparent; border:1px solid transparent; padding:6px 8px; display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; color:var(--secondary); text-align:left; }
    .sheet-nav button.active { background:var(--accent-soft); color:var(--accent); border-color:#d6e5f2; }
    .sheet-nav button small { color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
    .sheet-main { min-width:0; }
    .sheet-main .toolbar { padding-top:0; }
    .snapshot { font-size:12px; color:var(--muted); padding-bottom:12px; }
    .directory { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
    .directory-group { border-top:1px solid var(--line); }
    .directory-group h2 { padding:12px 0; }
    .directory-item { width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border:0; border-bottom:1px solid #e8ebee; background:transparent; text-align:left; border-radius:0; }
    .directory-item .item-title { font-size:13px; font-weight:500; }
    .directory-item .item-desc { font-size:12px; color:var(--muted); margin-top:2px; }
    button.directory-item:hover { color:var(--accent); }
    .directory-item .ico { color:var(--muted); width:16px; height:16px; }
    .section-title { margin-top:24px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    #content>.section-title:first-child { margin-top:0; }
    .summary-line { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); border-bottom:1px solid var(--line); padding:16px 0; gap:12px; }
    .summary-value { font-size:24px; line-height:32px; font-weight:500; font-variant-numeric:tabular-nums; }
    .summary-label { font-size:12px; color:var(--muted); }
    .summary-value.bad { color:var(--bad); }
    .summary-value.good { color:var(--good); }
    .section-anchor { scroll-margin-top:20px; }
    .jumpbar { display:flex; flex-wrap:wrap; gap:8px; padding:12px 0; border-bottom:1px solid var(--line); }
    .jumpbar a { font-size:12px; padding:4px 8px; color:var(--secondary); text-decoration:none; border-radius:3px; }
    .jumpbar a:hover { background:var(--raised); color:var(--accent); }
    .compact-line { display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:12px 0; border-bottom:1px solid var(--line); }
    .compact-line .head-actions { margin-left:auto; }
    .field-edit-layout { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:24px; }
    .preview-pane { background:#f8f9fa; border-left:1px solid var(--line); padding:16px; align-self:start; }
    .preview-line { display:grid; grid-template-columns:72px minmax(0,1fr); padding:8px 0; border-bottom:1px solid var(--line); gap:12px; font-size:12px; }
    .preview-line span:first-child { color:var(--muted); }
    .check { display:inline-flex; align-items:center; gap:8px; font-size:13px; }
    input[type=checkbox] { width:16px; height:16px; accent-color:var(--accent); cursor:pointer; }
    .settings-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    .settings-row { display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:52px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; }
    .settings-row .field { width:160px; }
    .empty { text-align:center; padding:40px 16px; color:var(--muted); }
    .import-grid { display:grid; grid-template-columns:1fr 1fr auto; gap:16px; align-items:end; padding:20px 0; border-bottom:1px solid var(--line); }
    .file-input { max-width:100%; font-size:12px; }
    .segments { display:flex; }
    .segments label { flex:1; position:relative; min-width:0; cursor:pointer; }
    .segments input { position:absolute; width:1px; height:1px; min-height:0; margin:-1px; padding:0; border:0; clip-path:inset(50%); overflow:hidden; }
    .segments span { display:flex; justify-content:center; border:1px solid #c7cfd7; border-left:0; min-height:36px; align-items:center; padding:4px; font-size:12px; white-space:nowrap; }
    .segments label:first-child span { border-left:1px solid #c7cfd7; border-radius:4px 0 0 4px; }
    .segments label:last-child span { border-radius:0 4px 4px 0; }
    .segments input:checked+span { background:var(--accent-soft); color:var(--accent); }
    .segments input:focus-visible+span { outline:2px solid var(--accent); }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .form-grid .full { grid-column:1/-1; }
    dialog { width:min(560px,calc(100% - 32px)); max-height:calc(100dvh - 32px); border:1px solid var(--line); border-radius:8px; padding:0; color:var(--ink); box-shadow:0 16px 64px #1c273329; }
    dialog::backdrop { background:#111c2d52; }
    .dialog-head { padding:16px 20px; border-bottom:1px solid var(--line); }
    .dialog-body { padding:20px; overflow:auto; }
    .dialog-foot { display:flex; align-items:center; justify-content:flex-end; gap:8px; padding:12px 20px; border-top:1px solid var(--line); }
    .dialog-body .notice { margin-bottom:0; }
    .form-error { font-size:12px; color:var(--bad); margin-top:12px; }
    #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#27303a; color:#fff; padding:12px 20px; border-radius:4px; box-shadow:0 4px 16px #0002; z-index:30; max-width:calc(100vw - 32px); font-size:13px; }
    .mobile-only { display:none; }
    .mobile-menu-close { display:none; }
    .mobile-records { display:none; }
    .mobile-record { background:white; border:1px solid var(--line); border-radius:4px; margin-bottom:8px; padding:12px; }
    .mobile-record-title { font-size:13px; font-weight:600; overflow-wrap:anywhere; }
    .mobile-record .data-line { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; font-size:12px; color:var(--secondary); margin-top:8px; }
    .mobile-record .row-actions { border-top:1px solid #e8ebee; padding-top:8px; margin-top:8px; }
    .mobile-record .text-action { min-height:32px; }
    .collapsed { --sidebar:64px; }
    .collapsed .sidebar-title,.collapsed .nav-group-title,.collapsed .nav-item .label,.collapsed .nav-foot { display:none; }
    .collapsed .nav-item { padding:8px 14px; justify-content:center; min-height:36px; }
    .collapsed .sidebar-top { justify-content:center; }
    .collapsed .nav-group { margin-top:12px; }
    @media(min-width:1100px) {
      .sidebar { position:sticky; top:0; height:100dvh; }
      .nav-scroll { overflow-y:auto; flex:1; min-height:0; scrollbar-width:thin; }
    }
    @media(max-width:1199px) {
      :root { --sidebar:208px; }
      main { padding:16px 20px 32px; }
      .field-edit-layout { grid-template-columns:minmax(0,1fr); gap:16px; }
      .preview-pane { border-left:0; border-top:1px solid var(--line); }
      .import-grid { grid-template-columns:1fr 1fr; }
      .import-grid>.button { justify-self:start; }
    }
    @media(max-width:899px) {
      :root { --control:40px; }
      .shell { display:block; }
      .sidebar { display:none; }
      .mobile-only { display:inline-flex; }
      .appbar .desktop-nav { display:none; }
      .appbar { padding:0 16px; }
      .account { padding-left:8px; margin-left:0; }
      main { padding:16px; }
      body.menu-open { overflow:hidden; }
      .menu-open .sidebar { display:flex; position:fixed; inset:0 auto 0 0; width:272px; max-width:calc(100vw - 40px); z-index:50; box-shadow:8px 0 0 100vmax #14223466; height:100dvh; }
      .menu-open .nav-scroll { flex:1; overflow:auto; }
      .menu-open .mobile-menu-close { display:inline-flex; }
      .menu-open #collapse { display:none; }
      .menu-open .sidebar-title { display:block; }
      .menu-open .nav-group-title,.menu-open .nav-item .label,.menu-open .nav-foot { display:block; }
      .menu-open .nav-item { justify-content:flex-start; }
      .nav-item { min-height:44px; }
      .page-head { align-items:flex-start; }
      .master-grid { grid-template-columns:132px minmax(0,1fr); gap:16px; }
      .table-wrap { border-left:1px solid var(--line); border-right:1px solid var(--line); }
      .toolbar-meta { margin-left:0; }
    }
    @media(max-width:599px) {
      :root { --control:44px; }
      .prototype-strip { padding:8px 12px; min-height:40px; gap:8px; }
      .prototype-strip .scope { display:none; }
      .appbar { padding:0 12px; gap:8px; }
      .brand { gap:8px; }
      .brand-mark { display:none; }
      .brand-name { font-size:14px; }
      .appbar nav { gap:0; }
      .appbar .icon-button { min-height:40px; width:36px; padding:8px; }
      .appbar .account { display:none; }
      main { padding:12px 12px 24px; }
      .breadcrumb { margin-bottom:8px; }
      h1 { font-size:20px; line-height:28px; }
      .page-head { display:block; margin-bottom:12px; }
      .head-actions { margin-top:12px; }
      .page-head p { font-size:12px; }
      .head-actions .button { min-height:40px; }
      .directory { grid-template-columns:1fr; gap:20px; }
      .tabs { gap:20px; }
      .tab { min-height:44px; }
      .toolbar { gap:8px; padding:12px 0; }
      .toolbar .search { width:100%; }
      .toolbar select { flex:1; min-width:96px; }
      .master-grid { grid-template-columns:1fr; gap:12px; }
      .sheet-nav { display:flex; overflow:auto; padding:0 0 8px; border-right:0; border-bottom:1px solid var(--line); gap:8px; }
      .sheet-nav button { width:auto; flex-shrink:0; gap:8px; white-space:nowrap; padding:8px; min-height:40px; }
      .sheet-main .toolbar { padding-bottom:12px; }
      .snapshot { padding:0 0 8px; font-size:11px; }
      .desktop-table { display:none; }
      .mobile-records { display:block; }
      .pagination { align-items:flex-start; flex-wrap:wrap; }
      .pagination .icon-button { min-height:36px; width:36px; }
      .pagination select { min-height:36px; }
      .summary-line { grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; padding:12px 0; }
      .summary-value { font-size:22px; line-height:28px; }
      .compact-line { gap:12px; }
      .compact-line .head-actions { margin-top:0; margin-left:0; }
      .settings-grid,.form-grid,.import-grid { grid-template-columns:1fr; }
      .settings-row { gap:12px; }
      .settings-row .field { width:140px; }
      .import-grid { padding:16px 0; }

    }
    function editMethod(index) {
      const creating=index===null;
      const m=creating?{name:'',instrument:'LC-20',type:'液相',coefficient:1,price:0,enabled:true}:methods[index];
      showDialog(creating?'新增检测方法':'编辑检测方法',`<div class="form-grid"><label class="field full">方法名称<input name="name" required maxlength="180" value="${esc(m.name)}"></label><label class="field">绑定仪器<input name="instrument" required value="${esc(m.instrument)}"></label><label class="field">检测类型<select name="type">${['液相','气相','理化','ICP','热分析','杂质制备'].map(t=>`<option ${m.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">工作量系数<input name="coefficient" type="number" min="0" step="0.01" required value="${m.coefficient}"></label><label class="field">单价<input name="price" type="number" min="0" step="0.01" required value="${m.price}"></label><label class="check"><input name="enabled" type="checkbox" ${m.enabled?'checked':''}>启用方法</label></div><div class="notice">修改名称、仪器和系数仍归于原方法身份；本页不改变历史记录。</div>`,form=>{
        const updated={name:form.get('name').trim(),instrument:form.get('instrument').trim(),type:form.get('type'),coefficient:Number(form.get('coefficient')),price:Number(form.get('price')),enabled:form.has('enabled')};
        if(!updated.name||!updated.instrument)return false;
        if(creating)methods.push(updated);else methods[index]=updated;
        refreshData();toast('方法配置已更新，仅本页有效');return true;
      });
    }
    function editAux(index) {
      const creating=index===null;
      const a=creating?{name:'',area:state.areas[0],category:'',coefficient:1,enabled:true}:auxiliaries[index];
      showDialog(creating?'新增辅助事项':'编辑辅助事项',`<div class="form-grid"><label class="field full">辅助事项<input name="name" required maxlength="120" value="${esc(a.name)}"></label><label class="field">区域<select name="area">${state.areas.map(x=>`<option ${a.area===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label class="field">分类<input name="category" value="${esc(a.category)}"></label><label class="field">工作量系数<input name="coefficient" type="number" min="0" step="0.01" required value="${a.coefficient}"></label><label class="check"><input name="enabled" type="checkbox" ${a.enabled?'checked':''}>启用事项</label></div><div class="notice">事项身份由程序识别，日常配置不显示。区域独立维护，不复用检测类型；不设置实验室或金额。</div>`,form=>{
        const updated={name:form.get('name').trim(),area:form.get('area'),category:form.get('category').trim(),coefficient:Number(form.get('coefficient')),enabled:form.has('enabled')};
        if(!updated.name)return false;if(creating)auxiliaries.push(updated);else auxiliaries[index]=updated;refreshData();toast('辅助事项已更新，仅本页有效');return true;
      });
    }
    function showAreas() {
      showDialog('辅助区域管理',`${table(['区域','状态'],state.areas.map(a=>`<tr><td>${esc(a)}</td><td>${badge('启用')}</td></tr>`).join(''))}<label class="field" style="margin-top:16px">新增区域名称<input name="area" required maxlength="120" placeholder="例如：制备区域"></label><div class="form-error" id="area-error" role="alert" hidden></div>`,form=>{
        const name=form.get('area').trim();if(!name)return false;
        if(state.areas.includes(name)){$('#area-error').textContent='该区域已存在';$('#area-error').hidden=false;return false;}
        state.areas.push(name);refreshData();toast('示例区域已新增');return true;
      },'新增区域');
    }
    function exportExample(kind) {
      const data=kind==='template'?'方法名称,仪器,检测类型,系数,单价,方法ID\n':'方法名称,仪器,检测类型,系数,单价\n'+methods.map(m=>[m.name,m.instrument,m.type,m.coefficient,m.price].join(',')).join('\n');
      const url=URL.createObjectURL(new Blob(['\ufeff'+data],{type:'text/csv;charset=utf-8'}));
      const a=document.createElement('a');a.href=url;a.download=kind==='template'?'布局参考-模板结构示例.csv':'布局参考-方法示例.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
      toast('已下载示例CSV；正式Excel模板仍使用现有导出器');
    }
    function previewOnly(name) {
      showDialog(name,`<p class="secondary">此处展示“${esc(name)}”的入口位置与弹窗层级。正式业务继续复用现有权限、字段及接口。</p><div class="notice">本参考稿没有连接后台，不会创建账号、保存身份绑定或发送通知。</div>`,()=>true,'关闭预览');
    }
    document.addEventListener('click',event=>{
      const target=event.target.closest('button,a');if(!target)return;
      if(target.dataset.view){go(target.dataset.view);return;}
      if(target.dataset.toast){toast(target.dataset.toast);return;}
      if(target.hasAttribute('data-close')){$('#dialog').close();return;}
      if(target.dataset.preview){previewOnly(target.dataset.preview);return;}
      if(target.dataset.tab){state.tab=target.dataset.tab;state.query='';state.page=1;refreshData();return;}
      if(target.dataset.sheet){state.sheet=target.dataset.sheet;state.query='';state.page=1;refreshData();return;}
      if(target.hasAttribute('data-add-method')){editMethod(null);return;}
      if(target.dataset.method!==undefined){editMethod(Number(target.dataset.method));return;}
      if(target.hasAttribute('data-add-aux')){editAux(null);return;}
      if(target.dataset.aux!==undefined){editAux(Number(target.dataset.aux));return;}
      if(target.hasAttribute('data-areas')){showAreas();return;}
      if(target.dataset.export){exportExample(target.dataset.export);return;}
      if(target.dataset.event!==undefined){const e=events[Number(target.dataset.event)];showDialog('通知发送详情',`<div class="preview-line"><span>通知编号</span><span>${e.no}</span></div><div class="preview-line"><span>事件来源</span><span>${e.source}</span></div><div class="preview-line"><span>投递渠道</span><span>${e.channel}</span></div><div class="preview-line"><span>投递状态</span>${badge(e.state,e.tone)}</div><div class="preview-line"><span>处理说明</span><span>${e.reason}</span></div><div class="notice">业务状态、群投递状态与个人通知已读状态分开保存及展示。</div>`,()=>true,'关闭');return;}
      if(target.dataset.retry!==undefined){const index=Number(target.dataset.retry);showDialog('确认补发通知',`<p>${events[index].no}</p><label class="field" style="margin-top:16px">补发原因<textarea name="reason" required rows="3"></textarea></label><div class="notice">仅失败渠道重新入队，成功渠道不重复发送；实际操作继续写入审计。</div>`,form=>{if(!form.get('reason').trim())return false;events[index].state='待发送';events[index].tone='warn';events[index].reason='示例补发已排队';refreshData();toast('示例状态已更新，未发送真实消息');return true;},'确认补发');return;}
      if(target.hasAttribute('data-process')){toast('示例：只展示队列操作位置，不触发真实发送');return;}
      if(target.hasAttribute('data-template')){showDialog('研发送样 · 通知字段配置',`${table(['字段','通知显示'],['项目代号','样品名称','数量','注意事项'].map(x=>`<tr><td>${x}</td><td><input type="checkbox" checked aria-label="${x}通知显示"></td></tr>`).join(''))}<div class="notice">字段继续从实际表单配置读取；原有字段名称、顺序、加粗和隐藏配置保持可用。</div>`,()=>{toast('模板布局已预览，未保存真实配置');return true;});return;}
      if(target.hasAttribute('data-message-preview')){showDialog('送样通知示例','<h3>研发送样通知</h3><div class="preview-line"><span>实验室</span><span>410-研究院</span></div><div class="preview-line"><span>项目代号</span><span>D002</span></div><div class="preview-line"><span>数量</span><span>2</span></div><div class="preview-line"><span>注意事项</span><span>避光保存</span></div>',()=>true,'关闭');return;}
      if(target.dataset.editField!==undefined){const f=fields[Number(target.dataset.editField)];showDialog('编辑字段',`<div class="form-grid"><label class="field">显示名称<input name="label" value="${esc(f.label)}" required></label><label class="field">列宽（px）<input name="width" value="${f.width}" type="number" min="60" max="800" step="4"></label><div class="field full">字段标识<span class="secondary">${f.key}</span></div></div><div class="notice">样品信息各检测类型独立的表单、列表、导出、必填规则仍在原编辑流程维护。</div>`,form=>{if(!form.get('label').trim())return false;f.label=form.get('label').trim();f.width=Number(form.get('width'));refreshData();return true;});return;}
      if(target.hasAttribute('data-precheck')){const file=$('#import-file').files[0];if(!file){toast('请先选择一个Excel文件');return;}$('#precheck-result').innerHTML=`<div class="notice">已选择：${esc(file.name)}。本稿不解析或上传文件；正式预检继续使用现有导入校验与引用保护。</div>`;return;}
      if(target.dataset.role!==undefined){const r=roles[Number(target.dataset.role)];showDialog(r[0]+' · 权限范围',`<div class="preview-line"><span>来源模板</span><span>${r[1]}</span></div><div class="preview-line"><span>权限数量</span><span>${r[3]}</span></div><div class="notice">复用现有角色权限矩阵、业务部门和实验室范围。此处仅用于检查弹窗排版。</div>`,()=>true,'关闭');return;}
      if(target.hasAttribute('data-backup-config')){showDialog('自动备份设置','<div class="form-grid"><label class="field">备份类型<select><option>全量备份</option><option>数据库备份</option></select></label><label class="field">保留数量<input type="number" min="1" value="10"></label><label class="check full"><input type="checkbox" checked>启用自动备份</label></div><div class="notice">本稿仅展示表单规格，不保存真实备份配置。</div>',()=>{toast('示例配置已查看，未改变备份任务');return true;});return;}
      if(target.hasAttribute('data-cloud')){showDialog('云端副本','<div class="form-grid"><label class="field full">接入类型<select><option>WebDAV</option><option>Nextcloud / ownCloud</option><option>OpenList 网关</option><option>OneDrive 全球版</option></select></label><label class="field full">远端目录<input value="/LabFlowBackup"></label></div><div class="notice">密码和授权信息继续在原安全配置流程维护，不在本稿填写或保存。</div>',()=>true,'关闭');return;}
      if(target.dataset.restore){showDialog('恢复备份',`<p style="overflow-wrap:anywhere">${esc(target.dataset.restore)}</p><div class="notice">正式操作会校验备份内容并覆盖当前数据。本稿只展示恢复确认层级，不执行恢复。</div><label class="check" style="margin-top:16px"><input type="checkbox" required>已了解这是离线恢复示例</label>`,()=>{toast('未连接后台，未执行恢复');return true;},'关闭示例');}
    });
    $('#dialog-form').addEventListener('submit',event=>{event.preventDefault();if(!event.currentTarget.reportValidity())return;const data=new FormData(event.currentTarget);if(state.dialogSave?.(data)!==false)$('#dialog').close();});
    $('#collapse').addEventListener('click',()=>{state.compact=!state.compact;document.body.classList.toggle('collapsed',state.compact);$('#collapse').setAttribute('aria-expanded',String(!state.compact));$('#collapse').setAttribute('aria-label',state.compact?'展开管理导航':'折叠管理导航');$('#collapse').title=state.compact?'展开管理导航':'折叠管理导航';$('#collapse').innerHTML=icon(state.compact?'right':'left');});
    $('#menu').addEventListener('click',()=>{document.body.classList.add('menu-open');$('#menu').setAttribute('aria-expanded','true');$('#close-menu').focus();});
    $('#close-menu').addEventListener('click',()=>{closeMenu();$('#menu').focus();});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&document.body.classList.contains('menu-open')){closeMenu();$('#menu').focus();}});
    document.addEventListener('pointerdown',event=>{if(document.body.classList.contains('menu-open')&&!event.target.closest('.sidebar,#menu'))closeMenu();});
    window.addEventListener('resize',()=>{if(window.innerWidth>=900)closeMenu();});
    render();
  </script>
</body>
</html>
