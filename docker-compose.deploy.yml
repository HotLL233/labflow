services:
  app:
    image: ${LABFLOW_IMAGE:-ghcr.io/hotll233/labflow}:${LABFLOW_VERSION:-latest}
    container_name: labflow-app
    ports:
      - "${WORKLOAD_BIND_IP:-0.0.0.0}:${WORKLOAD_SERVER_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-workload_app}:${POSTGRES_PASSWORD:-change_me_to_a_long_random_password}@postgres:5432/${POSTGRES_DB:-workload_tool}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      WORKLOAD_SERVER_MODE: "true"
      WORKLOAD_SERVER_PORT: "8000"
      WORKLOAD_DATA_DIR: /labflow-project/workload_data
      WORKLOAD_ATTACHMENT_PREVIEW_DIR: /labflow-project/workload_data/attachment_previews
      PERSONNEL_CHANGE_DATA_DIR: /labflow-project/workload_data/personnel-change-data
      WORKLOAD_PDFTOPPM_PATH: /usr/bin/pdftoppm
      WORKLOAD_PDFINFO_PATH: /usr/bin/pdfinfo
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: .
        target: /labflow-project
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5
    labels:
      # Deliberately opt out of blind image updaters. Use scripts/update-labflow.ps1
      # so backups and rollback checks always run before a release is installed.
      com.centurylinklabs.watchtower.enable: "false"
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}
    container_name: labflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workload_tool}
      POSTGRES_USER: ${POSTGRES_USER:-workload_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_to_a_long_random_password}
      PGDATA: /labflow-project/postgres_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - type: bind
        source: .
        target: /labflow-project
    restart: unless-stopped
